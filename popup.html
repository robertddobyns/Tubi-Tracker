<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; padding: 12px; font: 14px system-ui, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    #stats { color: #666; margin-bottom: 8px; }
    .bar { display: flex; gap: 6px; margin-bottom: 8px; }
    .bar select, .bar button { font: inherit; padding: 4px 8px; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid #eee; }
    li a { flex: 1; color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li a:hover { text-decoration: underline; }
    li button { border: 0; background: none; cursor: pointer; color: #999; font-size: 16px; }
    .empty { color: #888; padding: 12px 0; }
  </style>
</head>
<body>
  <h1>Tubi Watched Tracker</h1>
  <div id="stats"></div>
  <div class="bar">
    <select id="filter">
      <option value="all">All</option>
      <option value="watched">Watched</option>
      <option value="up">Thumbs up</option>
      <option value="down">Thumbs down</option>
    </select>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
